# pronounce-api config template.
#
# Copy this to config.toml (gitignored) and change what you need. Every key is optional: the
# values below are the defaults, and a missing config.toml is the same as an empty one.
# pronounce-api reads config.toml from the current working directory, and only from there
# (or the file named with --config).

[server]
# The address to listen on. 127.0.0.1 is this machine only: put a reverse proxy (nginx, Caddy) in
# front of it to open it up. "0.0.0.0" listens on every interface; an IPv6 address such as "::"
# works too.
host = "127.0.0.1"
port = 8000

[convert]
# The longest query, in characters (not bytes). A longer one is answered with 422.
max_query_chars = 300

# Words that are written out instead of being read from the dictionary. The key is a word as
# UniDic splits it (see `pronounce-api convert`), the value is the romaji it is replaced by.
# They win over the built-in ones (ラーメン = ramen, メイド = maid, ...).
#
# Use it when the foreign spelling UniDic has for a katakana word is a different foreign word with
# the same sound (ラーメン is "Rahmen", German for "frame").
[exceptions]
# "ナース" = "nurse"
